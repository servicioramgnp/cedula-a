<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador Cédula A · GAR</title>
<meta name="description" content="Simulador del examen de capacidad técnica de la CNSF para la Cédula A. Grupo Asesores RAM.">
<link rel="icon" href="logo-gar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="gar.css">
<style>
/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:end;padding-block:34px 26px}
.hero h1{font-size:clamp(2rem,5.4vw,3.3rem);font-weight:800;font-stretch:118%;margin-top:.5rem}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin-top:.8rem;max-width:58ch;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--ink);color:#fff;border-radius:var(--r-l);overflow:hidden}
.facts div{padding:1rem 1.1rem;border-right:1px solid var(--ink-3);border-bottom:1px solid var(--ink-3)}
.facts div:nth-child(2n){border-right:0}
.facts div:nth-last-child(-n+2){border-bottom:0}
.facts b{display:block;font-family:var(--mono);font-size:1.45rem;font-weight:600;color:#fff}
.facts span{font-size:.78rem;color:var(--on-ink-2)}
.sec{padding-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:1.45rem;font-weight:780}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:.7rem}
.mode.feature{border:2px solid var(--accent)}
.mode h3{font-size:1.35rem;font-weight:780}
.mode p{color:var(--muted);font-size:.92rem}
.modlist{display:grid;gap:.45rem;margin:0;padding:0;list-style:none}
.modlist li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;border-bottom:1px dashed var(--line);padding-bottom:.4rem}
.modlist li:last-child{border-bottom:0}
.modgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modcard{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:.85rem;display:flex;flex-direction:column;gap:.35rem;text-align:left}
.modcard:hover{border-color:var(--accent)}
.modcard .code{font-family:var(--mono);font-size:.72rem;color:var(--accent-ink)}
.modcard b{font-stretch:110%;font-size:1rem;line-height:1.2}
.modcard small{color:var(--muted);font-size:.78rem}
.practice-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:.35rem .8rem;font-size:.85rem;font-weight:550;display:inline-flex;gap:.4rem;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chip .n{font-family:var(--mono);font-size:.7rem;opacity:.75}
.progress{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.progress h3{font-size:1.05rem;margin-bottom:.8rem}

/* registro */
.auth{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:28px}
.auth .card{max-width:440px;width:100%;padding:1.6rem;display:grid;gap:1rem}
.auth h1{font-size:1.65rem;font-weight:800}

/* examen: hoja de respuestas */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:20px;padding-top:22px}
.qhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.qhead h2{font-size:1.3rem;margin-top:.25rem}
.qcard{padding:1.4rem}
.qnum{font-family:var(--mono);font-size:.82rem;color:var(--accent-ink);font-weight:600}
.qtext{font-size:1.18rem;line-height:1.45;margin:.5rem 0 1.1rem;font-weight:550;max-width:65ch}
.opts{display:grid;gap:.6rem}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:.75rem;align-items:center;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-m);padding:.75rem .9rem;font-size:.97rem;color:var(--text)}
.opt:hover{border-color:var(--line-2)}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-weight:750;font-stretch:115%;font-size:.92rem;color:var(--muted);background:var(--surface)}
.opt.sel{border-color:var(--fill)}
.opt.sel .bub{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:1rem;border-left:3px solid var(--accent);background:var(--accent-soft);padding:.75rem .9rem;border-radius:0 var(--r-s) var(--r-s) 0;font-size:.92rem;color:var(--text)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:1.1rem;flex-wrap:wrap}
.qnav .grp{display:flex;gap:.5rem;flex-wrap:wrap}
.flagbtn[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.sheet{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;border-top:4px solid var(--accent)}
.sheet .meta{font-size:.8rem;color:var(--muted);margin:.2rem 0 .8rem}
.dots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;font-family:var(--mono);font-size:.62rem;color:var(--muted);display:grid;place-items:center;padding:0;position:relative}
.dot.ans{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dot.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:1.5px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:.7rem;font-size:.72rem;color:var(--muted);margin:.8rem 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1.5px solid var(--line-2)}
.legend i.a{background:var(--fill);border-color:var(--fill)} .legend i.f{background:var(--warn);border-color:var(--warn)}
.sheet .btn{width:100%}

/* resultados */
.res-head{padding-block:30px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--ink)}
.res-head h1{font-size:clamp(1.8rem,4.6vw,2.7rem);font-weight:800}
.modres{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mr{display:grid;gap:.45rem;border-top:4px solid var(--line-2)}
.mr.ok{border-top-color:var(--ok)} .mr.warn{border-top-color:var(--warn)} .mr.bad{border-top-color:var(--bad)}
.mr .code{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.mr b{font-stretch:110%;font-size:1.02rem;line-height:1.2}
.mr .big{font-family:var(--mono);font-size:2.1rem;font-weight:600;line-height:1}
.mr .big small{font-size:.85rem;color:var(--muted);font-weight:500}
.review{display:grid;gap:.6rem}
.rv summary{cursor:pointer;display:flex;gap:.7rem;align-items:baseline;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv .qn{font-family:var(--mono);font-size:.75rem;color:var(--bad);flex:none}
.rv .qt{font-weight:550}
.rv .ans{margin-top:.7rem;display:grid;gap:.35rem;font-size:.9rem}
.rv .y{color:var(--bad)} .rv .c{color:var(--ok)}
.rv .tag{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:18px}
.interlude{max-width:660px;margin:36px auto 0;display:grid;gap:.9rem;border-top:4px solid var(--accent);padding:1.6rem}
.interlude h2{font-size:1.7rem;font-weight:800}
.interlude ul{margin:0;padding-left:1.1rem;color:var(--muted);font-size:.92rem;display:grid;gap:.25rem}

@media (max-width:880px){
  .hero{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .sheet{position:static;max-height:none}
  .dots{grid-template-columns:repeat(10,minmax(0,1fr))}
  .progress{grid-template-columns:1fr}
}
@media (max-width:600px){
  .g2,.modgrid{grid-template-columns:1fr}
  .practice-form{grid-template-columns:1fr}
  .qtext{font-size:1.05rem}
  .qcard{padding:1rem}
  .dots{grid-template-columns:repeat(8,minmax(0,1fr))}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <button class="brand" id="home-link" type="button" aria-label="Ir al inicio">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><b>Simulador Cédula A</b><small>Grupo Asesores RAM · Examen CNSF</small></span>
    </button>
    <div class="timer" id="timer" hidden><small>Tiempo</small><span id="timer-v">00:00</span></div>
    <div class="chip-user" id="user-chip" hidden></div>
  </div>
</header>

<main class="wrap" id="app"></main>
<div id="layer"></div>

<script src="banco.js"></script>
<script>
/* ═════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN
   API_URL: URL /exec de la aplicación web de Apps Script (Codigo.gs).
            Si la dejas vacía, el simulador funciona igual pero los
            resultados solo se guardan en el navegador del sustentante.
   GRUPOS:  opciones que ve el sustentante al registrarse.
   ═════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxMP85Vt1nfOl86opVaQMcO_nLVs11MfgEwasrJSfiKGmqaQPfxlfR44Mo01qf0MNduJA/exec',
  GRUPOS: ['GAR San Luis Potosí', 'GAR Querétaro', 'Proyecto Congresistas'],
};

// ── utilidades ──
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = a=>a[Math.floor(Math.random()*a.length)];
const rint = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const money = v=>"$"+v.toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const pctf = (v,d=2)=>(v*100).toLocaleString("es-MX",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const fmtTime = s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0")};
const LET = ["A","B","C","D"];
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const nowLabel = d=>d.toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
function level(p){ if(p>=.8) return {k:"ok",t:"Nivel 2"}; if(p>=.6) return {k:"warn",t:"Nivel 1"}; return {k:"bad",t:"No acredita"}; }
function lvlClass(p){ return p==null?"lvl-none":p>=.8?"lvl-ok":p>=.6?"lvl-warn":"lvl-bad"; }
const store = {
  get(k,d){ try{const v=localStorage.getItem("garCedA:"+k);return v?JSON.parse(v):d}catch(e){return d} },
  set(k,v){ try{localStorage.setItem("garCedA:"+k,JSON.stringify(v))}catch(e){} }
};

// ── reactivos de cálculo generados ──
function uniq4(correct, ds, fmt, jitter){
  const out=[correct]; const seen=new Set([fmt(correct)]);
  for(const d of ds){ if(d>0 && !seen.has(fmt(d))){out.push(d);seen.add(fmt(d))} if(out.length===4)break; }
  let k=1; while(out.length<4){ const d=jitter(correct,k++); if(d>0&&!seen.has(fmt(d))){out.push(d);seen.add(fmt(d))} }
  return out.map(fmt);
}
const GEN = [
  function interesSimple(){
    const C=rint(4,40)*5000, i=pick([6,8,9,10,12,15,18])/100, t=pick([3,4,6,8,9,10,18]);
    const I=C*i*t/12;
    return {q:`¿Cuánto interés simple genera un capital de ${money(C)} a una tasa de ${pctf(i,0)} anual durante ${t} meses?`,
      o:uniq4(I,[C*i, C*i*t, C*i*t/12+C],money,(c,k)=>c*(1+.1*k)),
      e:`I = C × i × t = ${money(C)} × ${i} × (${t}/12) = ${money(I)}. El tiempo se expresa en años porque la tasa es anual.`};
  },
  function montoSimple(){
    const C=rint(4,40)*5000, i=pick([6,8,10,12,15])/100, t=pick([6,9,18,24,30]);
    const M=C*(1+i*t/12);
    return {q:`Se invierten ${money(C)} a interés simple de ${pctf(i,0)} anual. ¿Cuál es el monto al cabo de ${t} meses?`,
      o:uniq4(M,[C*i*t/12, C*Math.pow(1+i,t/12), C*(1+i)],money,(c,k)=>c*(1+.05*k)),
      e:`M = C (1 + i t) = ${money(C)} × (1 + ${i} × ${t}/12) = ${money(M)}.`};
  },
  function montoCompuesto(){
    const C=rint(4,30)*5000, i=pick([5,6,8,10,12])/100, n=rint(2,5);
    const M=C*Math.pow(1+i,n);
    return {q:`¿Cuál será el monto de ${money(C)} invertidos a una tasa de ${pctf(i,0)} anual capitalizable anualmente durante ${n} años?`,
      o:uniq4(M,[C*(1+i*n), C*Math.pow(1+i,n-1), M-C],money,(c,k)=>c*(1+.04*k)),
      e:`M = C (1 + i)ⁿ = ${money(C)} × (1 + ${i})^${n} = ${money(M)}. Con interés compuesto, los intereses generan intereses.`};
  },
  function compuestoMensual(){
    const C=rint(4,30)*5000, j=pick([6,9,12,18])/100, y=pick([1,2,3]);
    const M=C*Math.pow(1+j/12,12*y);
    return {q:`Se depositan ${money(C)} a una tasa nominal de ${pctf(j,0)} anual capitalizable mensualmente. ¿Cuál es el monto al cabo de ${y} año${y>1?"s":""}?`,
      o:uniq4(M,[C*Math.pow(1+j,y), C*(1+j*y), C*Math.pow(1+j/12,y)],money,(c,k)=>c*(1+.03*k)),
      e:`Tasa mensual = ${j}/12 = ${(j/12).toFixed(4)}; periodos = ${12*y}. M = ${money(C)} × (1 + ${(j/12).toFixed(4)})^${12*y} = ${money(M)}.`};
  },
  function valorPresente(){
    const M=rint(10,60)*5000, i=pick([5,6,8,10,12])/100, n=rint(2,5);
    const C=M/Math.pow(1+i,n);
    return {q:`¿Qué cantidad debe invertirse hoy a ${pctf(i,0)} anual capitalizable anualmente para reunir ${money(M)} dentro de ${n} años?`,
      o:uniq4(C,[M/(1+i*n), M*Math.pow(1+i,-(n-1)), M*(1-i*n)],money,(c,k)=>c*(1-.04*k)),
      e:`Valor presente: C = M / (1 + i)ⁿ = ${money(M)} / (1 + ${i})^${n} = ${money(C)}.`};
  },
  function tasaReal(){
    let r,p; do{ r=rint(9,16)/100; p=rint(3,8)/100; }while(r<=p+0.02);
    const real=(1+r)/(1+p)-1; const f=v=>pctf(v,2);
    return {q:`Una inversión rinde ${pctf(r,0)} nominal anual y la inflación del periodo fue de ${pctf(p,0)}. ¿Cuál es la tasa real?`,
      o:uniq4(real,[r+p,(1+r)*(1+p)-1,r],f,(c,k)=>c+.011*k),
      e:`Tasa real = (1 + nominal) / (1 + inflación) − 1 = (1 + ${r}) / (1 + ${p}) − 1 = ${f(real)}. La resta simple (${pctf(r-p,0)}) es solo una aproximación.`};
  },
  function aDecimal(){
    const v=pick([0.5,1.25,2.5,4.75,7.5,12.5,16,35,0.75,3.2]);
    const f=x=>x.toLocaleString("es-MX",{maximumFractionDigits:6}); const d=v/100;
    return {q:`La notación decimal que corresponde a ${v.toLocaleString("es-MX")}% es:`,
      o:uniq4(d,[d*10,d/10,v],f,(c,k)=>c*(k+2)),
      e:`Para pasar de porcentaje a decimal se divide entre 100: ${v.toLocaleString("es-MX")} ÷ 100 = ${f(d)}.`};
  },
  function aPorcentaje(){
    const d=pick([0.045,0.0825,0.12,0.005,0.3,0.0675,1.15,0.016]);
    const f=x=>x.toLocaleString("es-MX",{maximumFractionDigits:4})+"%"; const p=d*100;
    return {q:`La notación porcentual que corresponde a ${d.toLocaleString("es-MX",{maximumFractionDigits:6})} es:`,
      o:uniq4(p,[p*10,p/10,d],f,(c,k)=>c*(k+2)),
      e:`Para pasar de decimal a porcentaje se multiplica por 100: ${d.toLocaleString("es-MX",{maximumFractionDigits:6})} × 100 = ${f(p)}.`};
  },
  function proporcion(){
    const Y=pick([100000,200000,250000,500000]), tasa=pick([3,4,5,6,8])/1000, Z=Y*pick([1.5,2,3,4,0.5]);
    const X=Y*tasa, P=X*Z/Y;
    return {q:`Si a una suma asegurada de ${money(Y)} le corresponde una prima de ${money(X)}, ¿qué prima corresponde a una suma asegurada de ${money(Z)} con la misma tasa?`,
      o:uniq4(P,[X*Y/Z, X+(Z-Y)/1000, P/2+X],money,(c,k)=>c*(1+.15*k)),
      e:`Proporción directa (regla de tres): prima = ${money(X)} × ${money(Z)} / ${money(Y)} = ${money(P)}.`};
  },
  function razon(){
    const tot=pick([20,25,40,50,80]), part=Math.round(tot*pick([.2,.25,.3,.35,.4,.45,.6,.75]));
    const p=part/tot; const f=v=>pctf(v,0);
    return {q:`Un agente cerró ${part} ventas de ${tot} citas. ¿Qué porcentaje de efectividad representa?`,
      o:uniq4(p,[part/100,(tot-part)/tot,p/2],f,(c,k)=>c+.05*k),
      e:`Razón = ${part} / ${tot} = ${p.toFixed(2)} → ${f(p)}.`};
  },
];
let genSeq=0;
function genCalc(){ const g=pick(GEN)(); return {id:"calc-g"+(++genSeq), t:"calc", s:"Cálculos financieros", q:g.q, o:g.o, e:g.e, gen:true}; }

// ── armado ──
function prep(q){ const order=shuffle([0,1,2,3]); return {...q, opts:order.map(i=>q.o[i]), correct:order.indexOf(0)}; }
function drawTema(tid,n){ return tid==="calc" ? Array.from({length:n},()=>prep(genCalc())) : shuffle(byTema[tid]).slice(0,n).map(prep); }
function buildModule(m){ const qs=m.temas.flatMap(t=>drawTema(t.id,t.n)); return {mod:m, qs, ans:Array(qs.length).fill(null), flags:Array(qs.length).fill(false), cur:0, timeLeft:modTime(m)*60}; }
function grade(b){
  const temas={}; let ok=0;
  b.qs.forEach((q,i)=>{ const c=b.ans[i]===q.correct; if(c)ok++; temas[q.t]=temas[q.t]||[0,0]; temas[q.t][1]++; if(c)temas[q.t][0]++; });
  return {ok,n:b.qs.length,temas};
}

// ── envío de resultados a la coordinación ──
const Sync = {
  state:"idle", // idle | sending | ok | queued | local
  cola(){ return store.get("cola",[]); },
  async enviar(intento){
    if(!CONFIG.API_URL){ this.state="local"; return; }
    const cola=this.cola(); cola.push(intento); store.set("cola",cola);
    await this.vaciar();
  },
  async vaciar(){
    if(!CONFIG.API_URL) return;
    let cola=this.cola(); if(!cola.length) return;
    this.state="sending"; paintSync();
    for(const it of cola.slice()){
      try{
        const r=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"guardarIntento",intento:it})});
        const j=await r.json();
        if(!j.ok) throw new Error(j.error||"Error del servidor");
        cola=this.cola().filter(x=>x.id!==it.id); store.set("cola",cola);
      }catch(e){ this.state="queued"; this.err=/fetch|network|offline|conexi/i.test(e.message)?"sin conexión":e.message; paintSync(); return; }
    }
    this.state="ok"; paintSync();
  }
};
function syncHTML(){
  const s=Sync.state;
  if(s==="local") return `<div class="banner info" id="sync">Este simulador aún no está conectado a la hoja de resultados; tu intento se guardó solo en este navegador.</div>`;
  if(s==="sending") return `<div class="banner info" id="sync">Enviando tu resultado a la coordinación GAR…</div>`;

function finishBlock(timeout){
  const b=S.run.blocks[S.run.bi]; b.timeout=!!timeout; setTimer(false); closeModal();
  if(S.run.bi===S.run.blocks.length-1) saveRun();
  S.view="blockdone"; render();
}
function saveRun(){
  const r=S.run, grades=r.blocks.map(grade), p=perfil();
  const temas={}; grades.forEach(g=>Object.entries(g.temas).forEach(([k,v])=>{temas[k]=temas[k]||[0,0];temas[k][0]+=v[0];temas[k][1]+=v[1]}));
  const isPr=r.mode==="practice";
  const mods=isPr?[]:r.blocks.map((b,i)=>({id:b.mod.id,ok:grades[i].ok,n:grades[i].n}));
  const ok=grades.reduce((s,g)=>s+g.ok,0), n=grades.reduce((s,g)=>s+g.n,0);
  const hist=store.get("hist",[]); hist.push({date:r.date,label:isPr?"Práctica":r.label,mods,ok,n,temas}); store.set("hist",hist.slice(-80));
  const errs=new Set(store.get("errs",[])); const vistos=[], fallados=[];
  r.blocks.forEach(b=>b.qs.forEach((q,i)=>{ if(q.gen) return; vistos.push(q.id); if(b.ans[i]===q.correct) errs.delete(q.id); else { errs.add(q.id); fallados.push(q.id); } }));
  store.set("errs",[...errs]);
  Sync.state="idle";
  Sync.enviar({id:uid(), nombre:p.nombre, correo:p.correo, grupo:p.grupo, tipo:isPr?"Práctica":r.label, modulos:mods, temas, aciertos:ok, reactivos:n,
    duracionSeg:Math.round((Date.now()-r.started)/1000), vistos, fallados, tiempoAgotado:r.blocks.filter(b=>b.timeout).map(b=>b.mod.id)});
}
function startPractice(qs,label){
  if(!qs.length){toast("Elige al menos un tema.");return}
  S.prac={qs:qs.map(prep),ans:Array(qs.length).fill(null),cur:0,label,started:Date.now()}; S.view="practice"; render();
}
function endPractice(){
  const p=S.prac, idx=p.ans.map((a,i)=>a!==null?i:-1).filter(i=>i>=0);
  if(!idx.length){S.view="home";render();return}
  S.run={mode:"practice",blocks:[{mod:{id:"PRA",name:"Práctica",temas:[]},qs:idx.map(i=>p.qs[i]),ans:idx.map(i=>p.ans[i]),flags:[]}],bi:0,date:nowLabel(new Date()),started:p.started};
  saveRun(); S.view="results"; render();
}

// ── modal y avisos ──
function openModal(inner){ $("#layer").innerHTML=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`; }
function closeModal(){ $("#layer").innerHTML=""; }
let toastT; function toast(m){ clearTimeout(toastT); let el=$(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)} el.textContent=m; toastT=setTimeout(()=>el.remove(),2800); }

// ── eventos ──
document.addEventListener("submit",e=>{
  if(e.target.id!=="reg") return; e.preventDefault();
  const nombre=$("#r-nombre").value.trim().replace(/\s+/g," "), correo=$("#r-correo").value.trim().toLowerCase();
  let grupo=$("#r-grupo").value; if(grupo==="__otro") grupo=$("#r-otro").value.trim();
  const err=$("#r-err"); const fail=m=>{err.textContent=m;err.hidden=false};
  if(nombre.split(" ").length<2) return fail("Escribe tu nombre completo (nombre y apellido).");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return fail("Revisa tu correo electrónico.");
  if(!grupo) return fail("Indica tu grupo.");
  store.set("perfil",{nombre,correo,grupo});
  S.view=(S.after&&S.after!=="registro")?S.after:"home"; S.after=null; render();
});
document.addEventListener("change",e=>{ if(e.target.id==="r-grupo"){ $("#r-otro-w").hidden=e.target.value!=="__otro"; } });
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const act=el.dataset.act;
  if(act==="scrim"){ if(e.target===el) closeModal(); return; }
  if(act==="close") return closeModal();
  if(act==="home"){ setTimer(false); S.view="home"; return render(); }
  if(act==="perfil"){ S.after="home"; S.view="registro"; return render(); }
  if(act==="retrysync"){ Sync.vaciar().then(()=>{ if(S.view==="home") render(); }); return; }
  if(act==="full") return startRun(MODULES);
  if(act==="mod") return startRun([modById[el.dataset.id]]);
  if(act==="start") return beginRun();
  if(act==="chip"){ const id=el.dataset.id; PRACTICE_SEL.has(id)?PRACTICE_SEL.delete(id):PRACTICE_SEL.add(id); el.setAttribute("aria-pressed",PRACTICE_SEL.has(id)); return; }
  if(act==="practice"){
    const sel=[...PRACTICE_SEL]; if(!sel.length) return toast("Elige al menos un tema.");
    const cnt=$("#pcount").value, onlyCalc=sel.length===1&&sel[0]==="calc";
    const calcN=sel.includes("calc")?(onlyCalc?(cnt==="all"?20:+cnt):(cnt==="all"?20:Math.max(5,Math.round((+cnt)/sel.length)))):0;
    const pool=shuffle(sel.filter(t=>t!=="calc").flatMap(t=>byTema[t]));
    const n=onlyCalc?0:(cnt==="all"?pool.length:Math.max(0,(+cnt)-calcN));
    return startPractice(shuffle([...pool.slice(0,n),...Array.from({length:calcN},genCalc)]), sel.map(t=>temaById[t].name).join(", "));
  }
  if(act==="errs"){ const ids=store.get("errs",[]).filter(id=>bankById[id]); return startPractice(shuffle(ids.map(id=>bankById[id])),"Mis errores"); }
  if(act==="retrywrong"){ const ws=[]; S.run.blocks.forEach(b=>b.qs.forEach((q,i)=>{ if(b.ans[i]!==q.correct&&!q.gen) ws.push(bankById[q.id]); })); return startPractice(shuffle(ws),"Reactivos fallados"); }
  if(S.view==="exam"){
    const b=S.run.blocks[S.run.bi];
    if(act==="ans"){ b.ans[b.cur]=+el.dataset.i; return render(); }
    if(act==="next"&&b.cur<b.qs.length-1){ b.cur++; return render(); }
    if(act==="prev"&&b.cur>0){ b.cur--; return render(); }
    if(act==="go"){ b.cur=+el.dataset.i; return render(); }
    if(act==="flag"){ b.flags[b.cur]=!b.flags[b.cur]; return render(); }
    if(act==="finish"){
      const pend=b.ans.filter(a=>a===null).length, fl=b.flags.filter(Boolean).length;
      return openModal(`<h3>¿Terminar esta prueba?</h3><p class="muted">${pend?`Tienes <b>${pend}</b> reactivo${pend>1?"s":""} sin contestar; contarán como incorrectos.`:"Contestaste todos los reactivos."}${fl?` Hay ${fl} marcado${fl>1?"s":""} para revisar.`:""} Te quedan <b class="mono">${fmtTime(b.timeLeft)}</b>.</p><div class="row"><button class="btn" data-act="close">Seguir revisando</button><button class="btn primary" data-act="confirmfinish">Terminar y calificar</button></div>`);
    }
  }
  if(act==="confirmfinish") return finishBlock(false);
  if(act==="exitconfirm"){ closeModal(); setTimer(false); S.view="home"; return render(); }
  if(act==="nextblock"){ S.run.bi++; S.view="exam"; render(); return setTimer(true); }
  if(act==="toresults"){ S.view="results"; return render(); }
  if(S.view==="practice"){
    const p=S.prac;
    if(act==="pans"&&p.ans[p.cur]===null){ p.ans[p.cur]=+el.dataset.i; return render(); }
    if(act==="pnext"){ p.cur++; return render(); }
    if(act==="pend") return endPractice();
  }
});
$("#home-link").addEventListener("click",()=>{
  if(S.view==="exam") return openModal(`<h3>¿Salir del simulacro?</h3><p class="muted">Perderás las respuestas de este intento y no se enviará resultado.</p><div class="row"><button class="btn" data-act="close">Continuar examen</button><button class="btn primary" data-act="exitconfirm">Salir</button></div>`);
  if(S.view==="registro"&&!perfil()) return;
  setTimer(false); S.view="home"; render();
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")||$("#layer").innerHTML) return;
  const k=e.key.toUpperCase(), map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(S.view==="exam"){
    const b=S.run.blocks[S.run.bi];
    if(k in map){ b.ans[b.cur]=map[k]; render(); }
    else if(e.key==="ArrowRight"&&b.cur<b.qs.length-1){ b.cur++; render(); }
    else if(e.key==="ArrowLeft"&&b.cur>0){ b.cur--; render(); }
  } else if(S.view==="practice"){
    const p=S.prac;
    if(k in map&&p.ans[p.cur]===null){ p.ans[p.cur]=map[k]; render(); }
    else if((e.key==="Enter"||e.key==="ArrowRight")&&p.ans[p.cur]!==null){ if(p.cur<p.qs.length-1){p.cur++;render()} else endPractice(); }
  }
});
window.addEventListener("beforeunload",e=>{ if(S.view==="exam"){ e.preventDefault(); e.returnValue=""; } });

render();
Sync.vaciar().then(()=>{ if(S.view==="home") render(); });
</script>
</body>

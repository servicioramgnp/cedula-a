<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Resultados Cédula A · GAR</title>
<link rel="icon" href="logo-gar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="gar.css">
<style>
.auth{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:28px}
.auth .card{max-width:420px;width:100%;padding:1.6rem;display:grid;gap:1rem}
.auth h1{font-size:1.6rem;font-weight:800}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-block:26px 16px}
.head h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters label.f{min-width:150px}
.filters .chk{display:flex;align-items:center;gap:.45rem;font-size:.86rem;font-weight:600;color:var(--muted);padding-bottom:.6rem}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{display:grid;gap:.2rem}
.kpi b{font-family:var(--mono);font-size:1.9rem;font-weight:600;line-height:1.1}
.kpi span{font-size:.82rem;color:var(--muted)}
.kpi.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.dark span{color:var(--on-ink-2)}
.sec{padding-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.3rem;font-weight:780}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}
.cell{display:inline-block;min-width:3.2rem;text-align:center;border-radius:6px;padding:.12rem .35rem;font-family:var(--mono);font-size:.8rem;font-weight:600}
.cell.ok{background:var(--ok-soft);color:var(--ok)} .cell.warn{background:var(--warn-soft);color:var(--warn)} .cell.bad{background:var(--bad-soft);color:var(--bad)} .cell.none{color:var(--muted)}
tr.rowlink{cursor:pointer} tr.rowlink:hover td{background:var(--surface-2)}
.who b{display:block;font-weight:650} .who small{color:var(--muted);font-size:.78rem}
.fails{display:grid;gap:.55rem;counter-reset:f}
.fail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem;align-items:start;padding:.65rem .8rem;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.fail p{font-size:.88rem;font-weight:550}
.fail small{color:var(--muted);font-size:.74rem}
.fail .rate{font-family:var(--mono);font-weight:600;color:var(--bad);text-align:right;font-size:.95rem}
.fail .rate small{display:block;font-weight:500}
.tabs{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:18px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:.45rem 1.1rem;font-weight:650;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--btn-dark);color:#fff}
.pinbox{font-family:var(--mono);font-size:2.2rem;font-weight:600;letter-spacing:.3em;background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-m);padding:.5rem 1rem;text-align:center}
.pin{font-family:var(--mono);letter-spacing:.12em}
.acts{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:flex-end}
tr.off td{opacity:.6}
textarea.in{min-height:150px;font-family:var(--mono);font-size:.85rem}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .cols,.dgrid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><b>Resultados Cédula A</b><small>Grupo Asesores RAM · Tablero de coordinación</small></span></div>
    <div class="chip-user" id="actions" hidden><button data-act="refresh">Actualizar</button><button data-act="csv">Exportar CSV</button><button data-act="logout">Salir</button></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="layer"></div>

<script src="banco.js"></script>
<script>
/* ═════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN
   API_URL: la misma URL /exec que usa index.html.
   Si la dejas vacía, el tablero abre en MODO DEMOSTRACIÓN con datos ficticios.
   ═════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  GRUPOS: ['GAR San Luis Potosí', 'GAR Querétaro', 'Proyecto Congresistas'],
  API_URL: 'https://script.google.com/macros/s/AKfycbxMP85Vt1nfOl86opVaQMcO_nLVs11MfgEwasrJSfiKGmqaQPfxlfR44Mo01qf0MNduJA/exec',
};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MODS=MODULES.map(m=>m.id);
const lvl=p=>p==null?"none":p>=.8?"ok":p>=.6?"warn":"bad";
const lvlTxt=p=>p>=.8?"Nivel 2":p>=.6?"Nivel 1":"No acredita";
const pct=p=>p==null?"—":Math.round(p*100)+"%";
const fdate=iso=>{const d=new Date(iso);return d.toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})};
const rel=iso=>{const d=(Date.now()-new Date(iso))/864e5; if(d<1) return "hoy"; if(d<2) return "ayer"; return "hace "+Math.floor(d)+" días";};
const ses={ get(){ try{return sessionStorage.getItem("garCedA:clave")}catch(e){return null} }, set(v){ try{v?sessionStorage.setItem("garCedA:clave",v):sessionStorage.removeItem("garCedA:clave")}catch(e){} } };
let CLAVE=ses.get(); let DATA=null; let DEMO=!CONFIG.API_URL;
const F={grupo:"",dias:"0",practicas:false,q:"",orden:"reciente",qs:"",gs:""};
let TAB="resultados"; const VERPIN=new Set();
const URL_SIM=new URL("./",location.href).href;

async function api(action,params={}){
  let r,j;
  try{ r=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,clave:CLAVE,...params})}); }
  catch(e){ throw new Error("No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo."); }
  try{ j=await r.json(); }catch(e){ throw new Error("El servidor respondió algo inesperado. Revisa que API_URL sea la URL /exec y que la aplicación web esté publicada para «Cualquier persona»."); }
  if(!j.ok) throw new Error(j.error==="CLAVE_INVALIDA"?"La clave no es correcta.":j.error);
  return j.data;
}

// ── datos de demostración ──
function demoData(){
  const names=[["Ana Torres","GAR Querétaro"],["Luis Méndez","GAR San Luis Potosí"],["Carla Ruiz","Proyecto Congresistas"],["Jorge Salas","Proyecto Congresistas"],["Paola Ibarra","GAR Querétaro"],["Raúl Ortega","GAR San Luis Potosí"],["Sofía Vega","Proyecto Congresistas"]];
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const out=[];
  names.forEach(([nom,g],k)=>{ const mail=nom.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(" ",".")+"@ejemplo.com";
    const skill=.45+k*.06, tries=1+Math.floor(rnd()*4);
    for(let t=0;t<tries;t++){
      const days=Math.floor(rnd()*25)+t; const full=rnd()>.4; const mods=full?MODULES:[MODULES[Math.floor(rnd()*4)]];
      const temas={}, modulos=[], vistos=[], fallados=[];
      mods.forEach(m=>{ let mo=0,mn=0; m.temas.forEach(tm=>{ const p=Math.min(.97,Math.max(.25,skill+t*.05+(rnd()-.5)*.25-(tm.id==="hogar"||tm.id==="calc"?.12:0))); const ok=Math.round(tm.n*p); temas[tm.id]=[ok,tm.n]; mo+=ok; mn+=tm.n;
        if(byTema[tm.id]) byTema[tm.id].slice(0,tm.n).forEach((q,i)=>{ vistos.push(q.id); if(rnd()>p+(i%7===0?-.3:.05)) fallados.push(q.id); }); });
        modulos.push({id:m.id,ok:mo,n:mn}); });
      const ok=modulos.reduce((s,m)=>s+m.ok,0), n=modulos.reduce((s,m)=>s+m.n,0);
      out.push({fecha:new Date(Date.now()-days*864e5-rnd()*864e5*0.5).toISOString(),nombre:nom,correo:mail,grupo:g,tipo:full?"Completo":"Prueba "+mods[0].id,aciertos:ok,reactivos:n,acredita:modulos.every(m=>m.ok/m.n>=.6)?"Sí":"No",duracionMin:Math.round(n*0.8),id:"demo"+k+"-"+t,modulos,temas,vistos,fallados,tiempoAgotado:[]});
    }
    out.push({fecha:new Date(Date.now()-rnd()*5*864e5).toISOString(),nombre:nom,correo:mail,grupo:g,tipo:"Práctica",aciertos:14,reactivos:20,acredita:"—",duracionMin:12,id:"demoP"+k,modulos:[],temas:{hogar:[9,12],auto:[5,8]},vistos:[],fallados:[],tiempoAgotado:[]});
  });
  const sus=names.concat([["Diego Navarro","GAR Querétaro"],["Elena Campos","GAR San Luis Potosí"]]).map(([nom,g],k)=>({id:"d"+k,nombre:nom,correo:nom.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(" ",".")+"@ejemplo.com",grupo:g,pin:String(482910+k*7351),activo:k!==8,alta:new Date(Date.now()-40*864e5).toISOString(),ultimoAcceso:k<7?new Date(Date.now()-k*2*864e5).toISOString():""}));
  return {intentos:out,sustentantes:sus,generado:new Date().toISOString()};
}

// ── cálculo ──
function filtrados(){
  const lim=+F.dias?Date.now()-(+F.dias)*864e5:0, q=F.q.trim().toLowerCase();
  return DATA.intentos.filter(i=>(!F.grupo||i.grupo===F.grupo)&&(!lim||new Date(i.fecha)>=lim)&&(F.practicas||i.tipo!=="Práctica")&&(!q||i.nombre.toLowerCase().includes(q)||i.correo.includes(q)));
}
function porPersona(list){
  const m={};
  list.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).forEach(i=>{
    const p=m[i.correo]=m[i.correo]||{correo:i.correo,nombre:i.nombre,grupo:i.grupo,sim:0,prac:0,last:null,mods:{},best:{},temas:{},intentos:[]};
    p.nombre=i.nombre; p.grupo=i.grupo; p.last=i.fecha; p.intentos.push(i);
    i.tipo==="Práctica"?p.prac++:p.sim++;
    i.modulos.forEach(x=>{ const v=x.ok/x.n; p.mods[x.id]=v; p.best[x.id]=Math.max(p.best[x.id]||0,v); });
    Object.entries(i.temas).forEach(([k,v])=>{ p.temas[k]=p.temas[k]||[0,0]; p.temas[k][0]+=v[0]; p.temas[k][1]+=v[1]; });
  });
  Object.values(m).forEach(p=>{
    const vals=MODS.map(k=>p.mods[k]);
    if(vals.some(v=>v==null)){ p.estado={k:"none",t:`Faltan ${vals.filter(v=>v==null).length} prueba${vals.filter(v=>v==null).length>1?"s":""}`,rank:1}; }
    else if(vals.every(v=>v>=.8)) p.estado={k:"ok",t:"Nivel 2 en todo",rank:4};
    else if(vals.every(v=>v>=.6)) p.estado={k:"ok",t:"Acredita las 4",rank:3};
    else { const f=vals.filter(v=>v<.6).length; p.estado={k:"bad",t:`Reprueba ${f} prueba${f>1?"s":""}`,rank:2}; }
    const ns=MODS.map(k=>p.mods[k]).filter(v=>v!=null); p.avg=ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:null;
  });
  return Object.values(m);
}
function masFallados(list,min=3){
  const v={},f={}; list.forEach(i=>{ i.vistos.forEach(id=>v[id]=(v[id]||0)+1); i.fallados.forEach(id=>f[id]=(f[id]||0)+1); });
  return Object.keys(v).filter(id=>v[id]>=min&&bankById[id]).map(id=>({id,q:bankById[id],v:v[id],f:f[id]||0,r:(f[id]||0)/v[id]})).sort((a,b)=>b.r-a.r||b.v-a.v);
}
function barHTML(name,p,extra=""){
  return `<div class="bar"><span>${esc(name)}</span><span class="track"><span class="fill lvl-${lvl(p)}" style="width:${p==null?0:Math.round(p*100)}%"></span><span class="tick"></span></span><span class="pct">${pct(p)}${extra}</span></div>`;
}

// ── vistas ──
function loginHTML(err=""){
  return `<section class="auth"><form class="card" id="login">
    <img class="gar-logo" src="logo-gar.png" alt="Grupo Asesores RAM">
    <div><div class="eyebrow">Tablero de coordinación</div><h1 style="margin-top:.35rem">Resultados del Simulador Cédula A</h1></div>
    <label class="f">Clave de administrador<input class="in" id="clave" type="password" autocomplete="current-password" required></label>
    ${err?`<p class="small" style="color:var(--bad)">${esc(err)}</p>`:""}
    <button class="btn primary" type="submit">Entrar</button>
  </form></section>`;
}
function dashHTML(){
  return `${DEMO?`<div class="banner info" style="margin-top:18px">Modo demostración: datos ficticios. Pega la URL de tu Apps Script en CONFIG.API_URL para ver los resultados reales.</div>`:""}
  <div class="tabs" role="tablist"><button role="tab" data-act="tab" data-id="resultados" aria-selected="${TAB==="resultados"}">Resultados</button><button role="tab" data-act="tab" data-id="accesos" aria-selected="${TAB==="accesos"}">Accesos${DATA.sustentantes?` <span class="mono" style="opacity:.7">${DATA.sustentantes.length}</span>`:""}</button></div>
  ${TAB==="accesos"?accesosHTML():resultadosHTML()}`;
}
function resultadosHTML(){
  const list=filtrados(), people=porPersona(list);
  const grupos=[...new Set(DATA.intentos.map(i=>i.grupo).filter(Boolean))].sort();
  const sims=list.filter(i=>i.tipo!=="Práctica");
  const listos=people.filter(p=>p.estado.rank>=3).length;
  const modAvg=MODS.map(k=>{const vs=people.map(p=>p.mods[k]).filter(v=>v!=null);return {k,v:vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null}}).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v);
  const tAgg={}; list.forEach(i=>Object.entries(i.temas).forEach(([k,v])=>{tAgg[k]=tAgg[k]||[0,0];tAgg[k][0]+=v[0];tAgg[k][1]+=v[1]}));
  const fails=masFallados(list).slice(0,10);
  const sorted=people.slice().sort(F.orden==="nombre"?(a,b)=>a.nombre.localeCompare(b.nombre):F.orden==="avance"?(a,b)=>(a.avg??-1)-(b.avg??-1):(a,b)=>new Date(b.last)-new Date(a.last));
  return `
  <section class="head"><div><div class="eyebrow">Actualizado ${fdate(DATA.generado)}</div><h1 style="margin-top:.3rem">Avance hacia la Cédula A</h1></div></section>
  <div class="filters">
    <label class="f">Grupo<select class="in" id="f-grupo"><option value="">Todos los grupos</option>${grupos.map(g=>`<option ${F.grupo===g?"selected":""}>${esc(g)}</option>`).join("")}</select></label>
    <label class="f">Periodo<select class="in" id="f-dias">${[["0","Todo"],["7","Últimos 7 días"],["30","Últimos 30 días"],["90","Últimos 90 días"]].map(([v,t])=>`<option value="${v}" ${F.dias===v?"selected":""}>${t}</option>`).join("")}</select></label>
    <label class="f">Buscar<input class="in" id="f-q" value="${esc(F.q)}" placeholder="Nombre o correo"></label>
    <label class="chk"><input type="checkbox" id="f-prac" ${F.practicas?"checked":""}> Incluir prácticas por tema</label>
  </div>
  <div class="kpis">
    <div class="card kpi dark"><b>${people.length}</b><span>sustentantes con actividad</span></div>
    <div class="card kpi"><b>${sims.length}</b><span>simulacros presentados</span></div>
    <div class="card kpi"><b>${listos}<span class="muted" style="font-size:1rem"> / ${people.length}</span></b><span>acreditan las 4 pruebas en su último resultado</span></div>
    <div class="card kpi"><b>${modAvg.length?esc(modAvg[0].k):"—"}</b><span>${modAvg.length?`prueba más difícil · promedio ${pct(modAvg[0].v)}`:"prueba más difícil"}</span></div>
  </div>

  <section class="sec">
    <div class="sec-h"><h2>Sustentantes</h2>
      <label class="f" style="flex-direction:row;align-items:center;gap:.5rem">Ordenar<select class="in" id="f-orden" style="width:auto">${[["reciente","Actividad más reciente"],["avance","Menor avance primero"],["nombre","Nombre"]].map(([v,t])=>`<option value="${v}" ${F.orden===v?"selected":""}>${t}</option>`).join("")}</select></label></div>
    ${sorted.length?`<div class="tablewrap"><table class="t"><thead><tr><th>Sustentante</th><th>Grupo</th><th class="num">Simulacros</th><th>Última actividad</th>${MODS.map(k=>`<th class="num" title="${esc(modById[k].name)}">${k}</th>`).join("")}<th>Estado</th></tr></thead><tbody>
      ${sorted.map(p=>`<tr class="rowlink" data-act="ver" data-id="${esc(p.correo)}" tabindex="0"><td class="who"><b>${esc(p.nombre)}</b><small>${esc(p.correo)}</small></td><td>${esc(p.grupo)}</td><td class="num">${p.sim}${p.prac?`<small class="muted"> +${p.prac}p</small>`:""}</td><td>${rel(p.last)}</td>${MODS.map(k=>`<td class="num"><span class="cell ${lvl(p.mods[k])}">${pct(p.mods[k])}</span></td>`).join("")}<td><span class="pill ${p.estado.k}">${esc(p.estado.t)}</span></td></tr>`).join("")}
    </tbody></table></div><p class="muted small" style="margin-top:.5rem">Cada prueba muestra el resultado más reciente del sustentante. Toca una fila para ver su historial.</p>`:`<div class="empty">Todavía no hay resultados con estos filtros. Los intentos aparecen aquí en cuanto un sustentante termina un simulacro.</div>`}
  </section>

  <section class="sec cols">
    <div class="card"><div class="sec-h"><h2>Dominio por tema</h2><span class="muted small">equipo</span></div>
      ${Object.keys(tAgg).length?`<div class="bars">${TEMAS.filter(t=>tAgg[t.id]).map(t=>barHTML(t.name,tAgg[t.id][0]/tAgg[t.id][1])).join("")}</div><p class="muted small" style="margin-top:.7rem">Porcentaje de aciertos de todos los reactivos presentados. La marca indica 60%.</p>`:`<div class="empty">Sin datos.</div>`}</div>
    <div class="card"><div class="sec-h"><h2>Reactivos más fallados</h2><span class="muted small">presentados 3 veces o más</span></div>
      ${fails.length?`<div class="fails">${fails.map(x=>`<div class="fail"><div><p>${esc(x.q.q)}</p><small>${esc(temaById[x.q.t].name)} · ${esc(x.q.s)} · Correcta: ${esc(x.q.o[0])}</small></div><div class="rate">${pct(x.r)}<small class="muted">${x.f} de ${x.v}</small></div></div>`).join("")}</div>`:`<div class="empty">Aparecerán cuando haya suficientes intentos.</div>`}</div>
  </section>`;
}
// ── Accesos ──
function gruposTodos(){ return [...new Set([...CONFIG.GRUPOS,...(DATA.sustentantes||[]).map(s=>s.grupo),...DATA.intentos.map(i=>i.grupo)].filter(Boolean))]; }
function ultimoIntento(correo){ let f=null; DATA.intentos.forEach(i=>{ if(i.correo===correo&&(!f||i.fecha>f)) f=i.fecha; }); return f; }
function accesosHTML(){
  if(!DATA.sustentantes) return `<div class="banner warn" style="margin-top:18px">Tu Apps Script todavía tiene la versión anterior. Pega el Codigo.gs nuevo y publica una nueva versión de la implementación para administrar accesos.</div>`;
  const q=F.qs.trim().toLowerCase();
  const lista=DATA.sustentantes.filter(s=>(!F.gs||s.grupo===F.gs)&&(!q||s.nombre.toLowerCase().includes(q)||s.correo.includes(q)))
    .map(s=>({...s,ult:ultimoIntento(s.correo)})).sort((a,b)=>(b.activo-a.activo)||a.nombre.localeCompare(b.nombre));
  const act=DATA.sustentantes.filter(s=>s.activo).length, sus=DATA.sustentantes.length-act;
  const sinPrac=DATA.sustentantes.filter(s=>{ if(!s.activo) return false; const u=ultimoIntento(s.correo); return !u||Date.now()-new Date(u)>7*864e5; }).length;
  return `
  <section class="head"><div><div class="eyebrow">Control de acceso por correo y PIN</div><h1 style="margin-top:.3rem">Sustentantes</h1></div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" data-act="masiva">Alta de varios</button><button class="btn primary" data-act="alta">Dar de alta</button></div></section>
  <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="card kpi dark"><b>${act}</b><span>con acceso activo</span></div>
    <div class="card kpi"><b>${sinPrac}</b><span>activos sin practicar en los últimos 7 días</span></div>
    <div class="card kpi"><b>${sus}</b><span>con acceso suspendido</span></div>
  </div>
  <div class="filters" style="margin-top:16px">
    <label class="f">Grupo<select class="in" id="f-gs"><option value="">Todos los grupos</option>${gruposTodos().sort().map(g=>`<option ${F.gs===g?"selected":""}>${esc(g)}</option>`).join("")}</select></label>
    <label class="f">Buscar<input class="in" id="f-qs" value="${esc(F.qs)}" placeholder="Nombre o correo"></label>
  </div>
  ${lista.length?`<div class="tablewrap"><table class="t"><thead><tr><th>Sustentante</th><th>Grupo</th><th>PIN</th><th>Estado</th><th>Último acceso</th><th>Último intento</th><th></th></tr></thead><tbody>
    ${lista.map(s=>`<tr class="${s.activo?"":"off"}"><td class="who"><b>${esc(s.nombre)}</b><small>${esc(s.correo)}</small></td><td>${esc(s.grupo)}</td>
      <td><button class="btn ghost sm pin" data-act="verpin" data-id="${esc(s.id)}" title="Mostrar u ocultar">${VERPIN.has(s.id)?esc(s.pin):"••••••"}</button></td>
      <td><span class="pill ${s.activo?"ok":"none"}">${s.activo?"Activo":"Suspendido"}</span></td>
      <td class="small">${s.ultimoAcceso?rel(s.ultimoAcceso):`<span class="muted">nunca</span>`}</td>
      <td class="small">${s.ult?rel(s.ult):`<span class="muted">sin intentos</span>`}</td>
      <td><div class="acts"><button class="btn ghost sm" data-act="bienv" data-id="${esc(s.id)}">Bienvenida</button><button class="btn ghost sm" data-act="editar" data-id="${esc(s.id)}">Editar</button><button class="btn ghost sm" data-act="pinnuevo" data-id="${esc(s.id)}">Nuevo PIN</button><button class="btn ghost sm ${s.activo?"danger":""}" data-act="estado" data-id="${esc(s.id)}">${s.activo?"Suspender":"Reactivar"}</button></div></td></tr>`).join("")}
  </tbody></table></div><p class="muted small" style="margin-top:.5rem">Al suspender a alguien ya no puede entrar ni enviar resultados; su historial se conserva. «Bienvenida» arma el mensaje con su liga, correo y PIN para mandarlo por WhatsApp.</p>`
  :`<div class="empty">${DATA.sustentantes.length?"Nadie coincide con estos filtros.":"Todavía no das de alta a nadie. Usa «Dar de alta» para una persona o «Alta de varios» para pegar una lista."}</div>`}`;
}
const susById=id=>(DATA.sustentantes||[]).find(s=>s.id===id);
function grupoSelect(id,val){ const gs=gruposTodos(); const otro=val&&!gs.includes(val);
  return `<select class="in" id="${id}">${gs.map(g=>`<option ${val===g?"selected":""}>${esc(g)}</option>`).join("")}<option value="__otro">Otro…</option></select>`; }
function formSusHTML(s){
  return `<form id="f-sus" data-id="${s?esc(s.id):""}" style="display:grid;gap:.85rem">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><h3>${s?"Editar sustentante":"Dar de alta"}</h3><button type="button" class="btn ghost sm" data-act="close" aria-label="Cerrar">✕</button></div>
    <label class="f">Nombre completo<input class="in" id="s-nombre" value="${s?esc(s.nombre):""}" required></label>
    <label class="f">Correo electrónico<input class="in" id="s-correo" type="email" value="${s?esc(s.correo):""}" required></label>
    <label class="f">Grupo${grupoSelect("s-grupo",s&&s.grupo)}</label>
    <label class="f" id="s-otro-w" hidden>Nombre del grupo<input class="in" id="s-otro"></label>
    <label class="f">PIN <span class="muted" style="font-weight:400">${s?"Déjalo vacío para conservar el actual":"Déjalo vacío para generar uno al azar"}</span><input class="in pin" id="s-pin" inputmode="numeric" maxlength="6" placeholder="••••••"></label>
    <p class="small" id="s-err" style="color:var(--bad)" hidden></p>
    <div class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit" id="s-btn">${s?"Guardar cambios":"Dar de alta"}</button></div>
  </form>`;
}
function mensaje(s){ return `Hola ${s.nombre.split(" ")[0]}, ya tienes acceso al Simulador Cédula A de Grupo Asesores RAM.\n\nEntra aquí: ${URL_SIM}\nCorreo: ${s.correo}\nPIN: ${s.pin}\n\nPractica por tema y presenta simulacros completos; tus resultados me llegan para darte seguimiento. ¡Mucho éxito!`; }
function bienvHTML(s,titulo){
  const m=mensaje(s);
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="eyebrow">${esc(s.grupo)}</div><h3 style="margin-top:.2rem">${esc(titulo||s.nombre)}</h3><p class="muted small">${esc(s.correo)}</p></div><button class="btn ghost sm" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="pinbox">${esc(s.pin)}</div>
    <label class="f">Mensaje de bienvenida<textarea class="in" id="b-msg" readonly>${esc(m)}</textarea></label>
    <div class="row"><a class="btn" href="https://wa.me/?text=${encodeURIComponent(m)}" target="_blank" rel="noopener">Abrir en WhatsApp</a><button class="btn primary" data-act="copiar" data-src="b-msg">Copiar mensaje</button></div>`;
}
function masivaHTML(){
  return `<form id="f-masiva" style="display:grid;gap:.85rem">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><h3>Alta de varios</h3><button type="button" class="btn ghost sm" data-act="close" aria-label="Cerrar">✕</button></div>
    <p class="muted small">Pega una persona por renglón: <b>Nombre completo, correo, grupo</b>. También puedes copiar tres columnas desde Excel o Sheets. Si no pones grupo, se usa el que elijas abajo. A cada quien se le genera un PIN.</p>
    <textarea class="in" id="m-lista" placeholder="Ana Torres, ana.torres@correo.com, GAR Querétaro&#10;Luis Méndez, luis@correo.com"></textarea>
    <label class="f">Grupo por defecto${grupoSelect("m-grupo","")}</label>
    <p class="small" id="m-err" style="color:var(--bad)" hidden></p>
    <div class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit" id="m-btn">Dar de alta</button></div>
  </form>`;
}
function masivaResHTML(r){
  const txt=r.creados.map(s=>`${s.nombre} · ${s.correo} · PIN ${s.pin}`).join("\n");
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><h3>${r.creados.length} alta${r.creados.length===1?"":"s"} lista${r.creados.length===1?"":"s"}</h3><button class="btn ghost sm" data-act="close" aria-label="Cerrar">✕</button></div>
    ${r.creados.length?`<label class="f">Accesos generados<textarea class="in" id="r-lista" readonly>${esc(txt)}</textarea></label>
    <p class="muted small">Desde la pestaña Accesos, «Bienvenida» arma el mensaje de cada persona con su liga.</p>`:""}
    ${r.omitidos.length?`<div><div class="eyebrow" style="margin-bottom:.4rem">No se dieron de alta (${r.omitidos.length})</div>${r.omitidos.map(o=>`<p class="small"><b>${esc(o.nombre||o.correo||"(renglón vacío)")}</b> <span class="muted">· ${esc(o.motivo)}</span></p>`).join("")}</div>`:""}
    <div class="row">${r.creados.length?`<button class="btn" data-act="copiar" data-src="r-lista">Copiar accesos</button>`:""}<button class="btn primary" data-act="close">Listo</button></div>`;
}
function leerGrupo(sel,otro){ const v=$("#"+sel).value; if(v!=="__otro") return v; const o=$("#"+otro); return o&&o.tagName==="INPUT"?o.value.trim():""; }
function upsertSus(s){ const i=DATA.sustentantes.findIndex(x=>x.id===s.id); if(i>=0) DATA.sustentantes[i]=s; else DATA.sustentantes.push(s); }
function demoGuardar(d){
  const n=d.nombre.trim().replace(/\s+/g," "), c=d.correo.trim().toLowerCase();
  if(n.split(" ").length<2) throw new Error("Escribe nombre y apellido.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) throw new Error("El correo no es válido.");
  if(DATA.sustentantes.some(x=>x.correo===c&&x.id!==d.id)) throw new Error("Ya existe un sustentante con ese correo.");
  const prev=d.id?susById(d.id):null;
  return {sustentante:{...(prev||{id:"d"+Date.now(),activo:true,alta:new Date().toISOString(),ultimoAcceso:""}),nombre:n,correo:c,grupo:d.grupo,pin:d.pin||(prev?prev.pin:String(100000+Math.floor(Math.random()*900000)))}};
}
async function copiarDe(id){
  const el=$("#"+id); const t=el.value;
  try{ await navigator.clipboard.writeText(t); toast("Copiado. Pégalo en WhatsApp o correo."); }
  catch(e){ el.focus(); el.select(); toast("Selecciona el texto y cópialo con Ctrl+C."); }
}

function detailHTML(correo){
  const all=DATA.intentos.filter(i=>i.correo===correo);
  const p=porPersona(all)[0]; if(!p) return "";
  const fails=masFallados(all,1).filter(x=>x.f>0).slice(0,6);
  return `<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div><div class="eyebrow">${esc(p.grupo)}</div><h3 style="margin-top:.2rem">${esc(p.nombre)}</h3><p class="muted small">${esc(p.correo)} · ${p.sim} simulacro${p.sim===1?"":"s"}${p.prac?` · ${p.prac} práctica${p.prac===1?"":"s"}`:""}</p></div>
      <div style="display:flex;gap:.5rem;align-items:center"><span class="pill ${p.estado.k}">${esc(p.estado.t)}</span><button class="btn ghost sm" data-act="close" aria-label="Cerrar">✕</button></div></div>
    <div class="dgrid">
      <div><div class="eyebrow" style="margin-bottom:.5rem">Último resultado por prueba</div><div class="bars">${MODULES.map(m=>barHTML(m.name,p.mods[m.id]??null,p.best[m.id]!=null&&p.best[m.id]!==p.mods[m.id]?`<small class="muted"> · mejor ${pct(p.best[m.id])}</small>`:"")).join("")}</div></div>
      <div><div class="eyebrow" style="margin-bottom:.5rem">Dominio por tema (acumulado)</div><div class="bars">${TEMAS.filter(t=>p.temas[t.id]).map(t=>barHTML(t.name,p.temas[t.id][0]/p.temas[t.id][1])).join("")||`<div class="empty">Sin datos</div>`}</div></div>
    </div>
    <div><div class="eyebrow" style="margin-bottom:.5rem">Historial</div>
      <div class="tablewrap"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th class="num">Total</th>${MODS.map(k=>`<th class="num">${k}</th>`).join("")}<th class="num">Min</th><th></th></tr></thead><tbody>
      ${p.intentos.slice().reverse().map(i=>{const mm=Object.fromEntries(i.modulos.map(x=>[x.id,x.ok/x.n]));return `<tr><td class="mono small">${fdate(i.fecha)}</td><td>${esc(i.tipo)}${i.tiempoAgotado&&i.tiempoAgotado.length?` <small class="muted">· tiempo agotado</small>`:""}</td><td class="num">${pct(i.aciertos/i.reactivos)}</td>${MODS.map(k=>`<td class="num"><span class="cell ${lvl(mm[k])}">${pct(mm[k])}</span></td>`).join("")}<td class="num">${i.duracionMin||"—"}</td><td><button class="btn ghost sm danger" data-act="del" data-id="${esc(i.id)}" data-who="${esc(correo)}">Eliminar</button></td></tr>`}).join("")}
      </tbody></table></div></div>
    ${fails.length?`<div><div class="eyebrow" style="margin-bottom:.5rem">Reactivos que más ha fallado</div><div class="fails">${fails.map(x=>`<div class="fail"><div><p>${esc(x.q.q)}</p><small>${esc(temaById[x.q.t].name)} · Correcta: ${esc(x.q.o[0])}</small></div><div class="rate">${x.f}/${x.v}</div></div>`).join("")}</div></div>`:""}`;
}

function render(){
  $("#actions").hidden=!DATA;
  $("#app").innerHTML=DATA?dashHTML():loginHTML(render.err);
}
async function cargar(){
  if(DEMO){ DATA=demoData(); return render(); }
  try{ DATA=await api("resumen"); render(); }
  catch(e){ if(/clave|CLAVE/.test(e.message)){ CLAVE=null; ses.set(null); } DATA=null; render.err=e.message; render(); }
}
function csv(){
  const head=["Fecha","Nombre","Correo","Grupo","Tipo","Aciertos","Reactivos","% Total",...MODS.map(k=>k+" %"),"Acredita","Duración (min)"];
  const rows=filtrados().map(i=>{const mm=Object.fromEntries(i.modulos.map(x=>[x.id,x.ok/x.n]));return [fdate(i.fecha),i.nombre,i.correo,i.grupo,i.tipo,i.aciertos,i.reactivos,Math.round(i.aciertos/i.reactivos*100),...MODS.map(k=>mm[k]!=null?Math.round(mm[k]*100):""),i.acredita,i.duracionMin]});
  const txt="﻿"+[head,...rows].map(r=>r.map(c=>{c=String(c);return /[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"})); a.download="resultados-cedula-a.csv"; document.body.appendChild(a); a.click(); a.remove();
}
function openModal(inner,wide){ $("#layer").innerHTML=`<div class="scrim" data-act="scrim"><div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">${inner}</div></div>`; }
function closeModal(){ $("#layer").innerHTML=""; }
let toastT; function toast(m){ clearTimeout(toastT); let el=$(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)} el.textContent=m; toastT=setTimeout(()=>el.remove(),2800); }

document.addEventListener("submit",async e=>{
  if(e.target.id==="f-sus"){
    e.preventDefault(); const id=e.target.dataset.id||null, err=$("#s-err"), btn=$("#s-btn");
    const d={id,nombre:$("#s-nombre").value,correo:$("#s-correo").value,grupo:leerGrupo("s-grupo","s-otro"),pin:$("#s-pin").value.trim()};
    if(d.pin&&!/^\d{6}$/.test(d.pin)){ err.textContent="El PIN debe tener 6 dígitos."; err.hidden=false; return; }
    btn.disabled=true;
    try{ const r=DEMO?demoGuardar(d):await api("guardarSustentante",{sustentante:d}); upsertSus(r.sustentante); render();
      if(id){ closeModal(); toast("Cambios guardados."); } else openModal(bienvHTML(r.sustentante,"Alta lista: "+r.sustentante.nombre));
    }catch(x){ err.textContent=x.message; err.hidden=false; btn.disabled=false; }
    return;
  }
  if(e.target.id==="f-masiva"){
    e.preventDefault(); const err=$("#m-err"), btn=$("#m-btn"), def=leerGrupo("m-grupo","m-grupo");
    const lista=$("#m-lista").value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split(/\t|,|;/).map(x=>x.trim()); return {nombre:p[0]||"",correo:p[1]||"",grupo:p[2]||def}; });
    if(!lista.length){ err.textContent="Pega al menos un renglón."; err.hidden=false; return; }
    btn.disabled=true; btn.textContent="Dando de alta…";
    try{
      let r;
      if(DEMO){ r={creados:[],omitidos:[]}; lista.forEach(d=>{ try{ const x=demoGuardar(d).sustentante; upsertSus(x); r.creados.push(x);}catch(z){ r.omitidos.push({...d,motivo:z.message}); } }); }
      else { r=await api("altaMasiva",{lista}); r.creados.forEach(upsertSus); }
      render(); openModal(masivaResHTML(r));
    }catch(x){ err.textContent=x.message; err.hidden=false; btn.disabled=false; btn.textContent="Dar de alta"; }
    return;
  }
  if(e.target.id!=="login") return; e.preventDefault(); CLAVE=$("#clave").value; ses.set(CLAVE); render.err=""; $("#app").innerHTML=`<div class="empty" style="margin-top:40px">Cargando resultados…</div>`; cargar(); });
document.addEventListener("input",e=>{ if(e.target.id==="f-qs"){ F.qs=e.target.value; const pos=e.target.selectionStart; render(); const el=$("#f-qs"); el.focus(); el.setSelectionRange(pos,pos); return; } if(e.target.id==="f-q"){ F.q=e.target.value; const pos=e.target.selectionStart; render(); const el=$("#f-q"); el.focus(); el.setSelectionRange(pos,pos); } });
document.addEventListener("change",e=>{ const id=e.target.id; if(id==="f-grupo")F.grupo=e.target.value; else if(id==="f-dias")F.dias=e.target.value; else if(id==="f-prac")F.practicas=e.target.checked; else if(id==="f-orden")F.orden=e.target.value; else if(id==="f-gs")F.gs=e.target.value;
  else if(id==="s-grupo"){ $("#s-otro-w").hidden=e.target.value!=="__otro"; return; }
  else return; render(); });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches("tr.rowlink")) e.target.click(); if(e.key==="Escape") closeModal(); });
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const act=el.dataset.act;
  if(act==="scrim"){ if(e.target===el) closeModal(); return; }
  if(act==="close") return closeModal();
  if(act==="ver") return openModal(detailHTML(el.dataset.id),true);
  if(act==="tab"){ TAB=el.dataset.id; return render(); }
  if(act==="alta") return openModal(formSusHTML(null));
  if(act==="editar") return openModal(formSusHTML(susById(el.dataset.id)));
  if(act==="masiva") return openModal(masivaHTML());
  if(act==="bienv") return openModal(bienvHTML(susById(el.dataset.id)));
  if(act==="copiar") return copiarDe(el.dataset.src);
  if(act==="verpin"){ const id=el.dataset.id; VERPIN.has(id)?VERPIN.delete(id):VERPIN.add(id); return render(); }
  if(act==="pinnuevo"){ const s=susById(el.dataset.id); return openModal(`<h3>¿Generar un PIN nuevo para ${esc(s.nombre)}?</h3><p class="muted">Su PIN actual dejará de funcionar. Tendrá que entrar con el nuevo.</p><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="pinok" data-id="${esc(s.id)}">Generar PIN</button></div>`); }
  if(act==="pinok"){ el.disabled=true; try{ const r=DEMO?{sustentante:{...susById(el.dataset.id),pin:String(100000+Math.floor(Math.random()*900000))}}:await api("nuevoPin",{id:el.dataset.id}); upsertSus(r.sustentante); render(); openModal(bienvHTML(r.sustentante,"PIN nuevo para "+r.sustentante.nombre)); }catch(x){ closeModal(); toast(x.message); } return; }
  if(act==="estado"){ const s=susById(el.dataset.id); return openModal(`<h3>¿${s.activo?"Suspender":"Reactivar"} a ${esc(s.nombre)}?</h3><p class="muted">${s.activo?"No podrá entrar al simulador ni enviar resultados. Su historial se conserva y puedes reactivarlo cuando quieras.":"Podrá volver a entrar con su mismo correo y PIN."}</p><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="estadook" data-id="${esc(s.id)}">${s.activo?"Suspender":"Reactivar"}</button></div>`); }
  if(act==="estadook"){ const s=susById(el.dataset.id); el.disabled=true; try{ const r=DEMO?{sustentante:{...s,activo:!s.activo}}:await api("cambiarEstado",{id:s.id,activo:!s.activo}); upsertSus(r.sustentante); closeModal(); render(); toast(r.sustentante.activo?"Acceso reactivado.":"Acceso suspendido."); }catch(x){ closeModal(); toast(x.message); } return; }
  if(act==="refresh"){ toast("Actualizando…"); await cargar(); return toast("Resultados actualizados."); }
  if(act==="csv") return csv();
  if(act==="logout"){ CLAVE=null; ses.set(null); DATA=null; render.err=""; return render(); }
  if(act==="del"){ openModal(`<h3>¿Eliminar este intento?</h3><p class="muted">Se borrará de la hoja de resultados. Úsalo para quitar pruebas o intentos duplicados.</p><div class="row"><button class="btn" data-act="ver" data-id="${esc(el.dataset.who)}">Cancelar</button><button class="btn primary" data-act="delok" data-id="${esc(el.dataset.id)}" data-who="${esc(el.dataset.who)}">Eliminar</button></div>`); return; }
  if(act==="delok"){
    const id=el.dataset.id, who=el.dataset.who;
    try{ if(!DEMO) await api("eliminarIntento",{id}); DATA.intentos=DATA.intentos.filter(i=>i.id!==id); toast("Intento eliminado."); }
    catch(err){ toast(err.message); }
    render(); if(DATA.intentos.some(i=>i.correo===who)) openModal(detailHTML(who),true); else closeModal(); return;
  }
});

if(DEMO||CLAVE){ $("#app").innerHTML=`<div class="empty" style="margin-top:40px">Cargando resultados…</div>`; cargar(); } else render();
</script>
</body>
</html>
